    <script>
      // Suppress third-party browser extension injection noise (e.g. MetaMask in sandboxed iframes)
      (function() {
        if (typeof window === 'undefined') return;
        const ignorePattern = /MetaMask|ethereum|chrome-extension|moz-extension|evmProvider/i;
        
        const origError = console.error;
        console.error = function(...args) {
          if (args.some(arg => typeof arg === 'string' && ignorePattern.test(arg))) {
            return;
          }
          if (args.some(arg => arg instanceof Error && ignorePattern.test(arg.message))) {
            return;
          }
          origError.apply(console, args);
        };

        const origWarn = console.warn;
        console.warn = function(...args) {
          if (args.some(arg => typeof arg === 'string' && ignorePattern.test(arg))) {
            return;
          }
          origWarn.apply(console, args);
        };

        window.addEventListener('error', function(e) {
          if (
            (e.message && ignorePattern.test(e.message)) ||
            (e.filename && ignorePattern.test(e.filename))
          ) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          var reason = e.reason;
          var msg = typeof reason === 'string' ? reason : (reason && reason.message) ? reason.message : '';
          if (ignorePattern.test(msg)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return false;
          }
        }, true);
      })();
    </script>
